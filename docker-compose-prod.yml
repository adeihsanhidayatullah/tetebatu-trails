services:
  # Frontend & API Service (Next.js - Standalone Production Mode)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tetebatu-trails-web
    # Port terisolasi internal, hanya diakses melalui Traefik
    expose:
      - "4422"
    restart: always
    volumes:
      # Data persisten (JSON database & file uploads)
      - ./src/data:/app/src/data
      - ./public/uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
      - PORT=4422
      - NEXT_PUBLIC_APP_URL=${APP_URL:-https://${DOMAIN:-trails.tetebatu.com}}
    networks:
      - traefik-bridge
    labels:
      - "traefik.enable=true"
      # Routing Utama & SSL Matcher
      - "traefik.http.routers.tetebatu-trails.rule=Host(`${DOMAIN:-trails.tetebatu.com}`) || Host(`www.${DOMAIN:-trails.tetebatu.com}`)"
      - "traefik.http.routers.tetebatu-trails.entrypoints=websecure"
      - "traefik.http.routers.tetebatu-trails.tls=true"
      - "traefik.http.routers.tetebatu-trails.tls.certresolver=mytlschallenge"

      # Load Balancer Port Internal Kontainer Next.js & Jaringan Traefik
      - "traefik.http.services.tetebatu-trails.loadbalancer.server.port=4422"
      - "traefik.docker.network=n8n-docker_default"

      # 1. Middleware Redirection (www ke non-www)
      - "traefik.http.middlewares.tetebatu-trails-www-redirect.redirectregex.regex=^https://www.(.*)"
      - "traefik.http.middlewares.tetebatu-trails-www-redirect.redirectregex.replacement=https://$${1}"

      # 2. Middleware Keamanan (Security Headers & HSTS)
      - "traefik.http.middlewares.tetebatu-trails-headers.headers.sslRedirect=true"
      - "traefik.http.middlewares.tetebatu-trails-headers.headers.stsSeconds=315360000"
      - "traefik.http.middlewares.tetebatu-trails-headers.headers.browserXSSFilter=true"
      - "traefik.http.middlewares.tetebatu-trails-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.tetebatu-trails-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.tetebatu-trails-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.tetebatu-trails-headers.headers.stsPreload=true"

      # Ikat Middleware ke Router Next.js
      - "traefik.http.routers.tetebatu-trails.middlewares=tetebatu-trails-www-redirect@docker,tetebatu-trails-headers@docker"

networks:
  traefik-bridge:
    name: n8n-docker_default
    external: true
